name: cd-build

on:
  push:
    tags:
    - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4.1.4

    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@v5.0.1
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.100
    
    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    - name: 'Get Version'
      id: version
      run: |
        $version = $env:GITHUB_REF -replace '^refs/tags/v', ''
        Write-Host "Extracted version: $version"
        echo "version=$version" >> $env:GITHUB_OUTPUT

    - name: Build
      run: |
        msbuild /restore `
                /t:Build,Pack src/WinUI.TableView.csproj `
                /p:Configuration=Release `
                /p:Version=${{ steps.version.outputs.version }} `
                /p:PackageReleaseNotes="https://w-ahmad.dev/WinUI.TableView/docs/release-notes/v${{ steps.version.outputs.version }}.html"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: NuGet Packages
        path: artifacts/NuGet/Release 

  publish:
    needs: [build]
    runs-on: windows-latest
    environment: cd-nuget-publish
    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job
    steps:
        
    - name: NuGet Login
      uses: NuGet/login@v1
      id: login
      with:
        user: w-ahmad
    
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: NuGet Packages
        path: packages

    - name: Push to NuGet
      run: |
        dotnet nuget push packages\*.nupkg -k ${{steps.login.outputs.NUGET_API_KEY}} -s https://api.nuget.org/v3/index.json --skip-duplicate
        
